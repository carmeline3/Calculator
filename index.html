<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <form>

        <div class="background">
            <div class="screen">
                <!-- <div class="number">

</div>

<div class="results">

</div> -->
            </div>

            <div class="button">
                <div class="first-row">
                    <div class="first-block">
                        <button data-operation>+/-</button>
                    </div>
                    <div class="first-block">
                        <button data-operation>%</button>
                    </div>
                    <div class="first-block">
                        <button data-operation><span class="symbol">&radic;</span></button>
                    </div>
                    <div class="first-block">
                        <button data-delete>CC</button>
                    </div>

                </div>


                <div class="nd-row">


                    <div class="nd-block">
                        <button data-number>7</button>
                    </div>
                    <div class="nd-block">
                        <button data-number>8</button>
                    </div>
                    <div class="nd-block">
                        <button data-number>9</button>
                    </div>
                    <div class="nd-blocker">
                        <button data-operation>*</button>
                    </div>
                </div>

                <div class="third-row">
                    <div class="third-block">
                        <button data-number>4</button>
                    </div>
                    <div class="third-block">
                        <button data-number>5</button>
                    </div>
                    <div class="third-block">
                        <button data-number>6</button>
                    </div>
                    <div class="third-blocker">
                        <button data-operation>-</button>
                    </div>
                </div>
                <div class="forth-row">
                    <div class="forth-block">
                        <button data-number>1</button>
                    </div>
                    <div class="forth-block">
                        <button data-number>2</button>
                    </div>
                    <div class="forth-block">
                        <button data-number>3</button>
                    </div>
                    <div class="forth-blocker">
                        <button>( )</button>
                    </div>
                </div>
                <div class="fifth-row">
                    <div class="fifth-block">
                        <button data-number>0</button>
                    </div>
                    <div class="fifth-block">
                        <button data-number>.</button>
                    </div>
                    <div class="fifth-block">
                        <button data-equals>+</button>

                    </div>
                    <div class="fifth-blocker">
                        <button>=</button>
                    </div>
                </div>

            </div>
        </div>



        </div>
    </form>
</body>

</html>
