<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <form>

    <div class="background">
        <div class="screen">

        </div>

        <div class="button">
            <div class="first-row">
                <div class="first-block">
                    <p>+/-</p>
                </div>
                <div class="first-block">
                    <p>%</p>
                </div>
                <div class="first-block">
                    <p><span class="symbol">&radic;</span></p>
                </div>
                <div class="first-block">
                   <p>CC</p>
                </div>

            </div>

           
            <div class="nd-row">


                <div class="nd-block">
<p>7</p>
                </div>
                <div class="nd-block">
<p>8</p>
                </div>
                <div class="nd-block">
<p>9</p>
                </div>
                <div class="nd-blocker">
                    <p>*</p>
                </div>
            </div>

            <div class="third-row">
                <div class="third-block">
                    <p>4</p>
                </div>
                <div class="third-block">
                   <p>5</p>
                </div>
                <div class="third-block">
                     <p>6</p>
                </div>
                <div class="third-blocker">
                   <p>-</p>
                </div>
            </div>
            <div class="forth-row">
                <div class="forth-block">
                    <p>1</p>
                </div>
                 <div class="forth-block">
                    <p>2</p>
                </div>
                 <div class="forth-block">
                    <p>3</p>
                </div>
                 <div class="forth-blocker">
                    <p>( )</p>
                </div>
            </div>
            <div class="fifth-row">
                <div class="fifth-block">
  <p>0</p>
                </div>
                <div class="fifth-block">
                    <p>.</p>
                </div>
                <div class="fifth-block">
                      <p>+</p>
                   
                </div>
                <div class="fifth-blocker">
                 <p>=</p>
                </div>
            </div>

        </div>
    </div>



    </div>
    </form>
</body>

</html>
