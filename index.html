<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <form>

        <div class="background">
             <input id="display" readonly>
                <!-- <div id="keys">
                    
                </div> -->
           
            

            <div class="keys">
                <div class="first-row">
                    <div class="first-block">
                       <input type="button" value="+" onclick="display.value +='+' " class="bblocker">
                    </div>
                    <div class="first-block">
                        <input type="button" value="%" onclick="display.value +='%' " class="bblocker">
                    </div>
                    <div class="first-block">
                       <input type="button" value="De" onclick="display.value = display.value.toString().slice(0,-1) " class="bblocker">   
                    </div>
                    <div class="first-block">
                       <input type="button" value="C" onclick="display.value ='' " class="bblocker">
                    </div>

                </div>


                <div class="nd-row">


                    <div class="nd-block">
                        <input type="button" value="7" onclick="display.value +='7' " class="bb">
                    </div>
                    <div class="nd-block">
                       <input type="button" value="8" onclick="display.value +='8' " class="bb">
                    </div>
                    <div class="nd-block">
                       <input type="button" value="9" onclick="display.value +='9' " class="bb">
                    </div>
                    <div class="nd-blocker">
                       <input type="button" value="*" onclick="display.value +='*' " class="bblocker">
                       
                    </div>
                </div>

                <div class="third-row">
                    <div class="third-block">
                       <input type="button" value="4" onclick="display.value +='4' " class="bb">
                    </div>
                    <div class="third-block">
                       <input type="button" value="5" onclick="display.value +='5' " class="bb">
                    </div>
                    <div class="third-block">
                      <input type="button" value="6" onclick="display.value +='6' " class="bb">
                    </div>
                    <div class="third-blocker">
                       <input type="button" value="-" onclick="display.value +='-' " class="bblocker">
                    </div>
                </div>
                <div class="forth-row">
                    <div class="forth-block">
                       <input type="button" value="1" onclick="display.value +='1' " class="bb">
                    </div>
                    <div class="forth-block">
                        <input type="button" value="2" onclick="display.value +='2' " class="bb">
                    </div>
                    <div class="forth-block">
                        <input type="button" value="3" onclick="display.value +='3' " class="bb">
                    </div>
                    <div class="forth-blocker">
                     <input type="button" value="/" onclick="display.value +='/' " class="bblocker">
                    </div>
                </div>
                <div class="fifth-row">
                    <div class="fifth-block">
                       <input type="button" value="0" onclick="display.value +='0' " class="bb">
                    </div>
                    <div class="fifth-block">
                           <input type="button" value="." onclick="display.value +='.' " class="bb">
                    </div>
                    <div class="fifth-block">
                           <input type="button" value="+" onclick="display.value +='+' " class="bb">

                    </div>
                    <div class="fifth-blocker">
                           <input type="button" value="=" onclick="display.value = eval(display.value) " class="bblocker">
                    </div>
                </div>

            </div>
        </div>



        </div>
    </form>
      <!-- <script src="index.js"></script> -->
</body>

</html>
