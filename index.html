<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" readonly>

        <div class="buttons">

            
            <input type="button" value="&#8730;" class="scientific"onclick="squareRoot()">
            <input type="button" value="x^" class="scientific" onclick="getOperator('x^')">
            <input type="button" value="&#960;" class="scientific" onclick="">
          <input type="button" value="x&#178;" class="scientific" onclick="squareNumber()">
            <input type="button" value="C" class="operator"onclick="clearDisplay()">
            <input type="button" value="DE" class="operator" onclick="getOperator('')">
            <input type="button" value="(" class="operator" onclick="getOperator('')">
            <input type="button" value=")" class="operator" onclick="getOperator('')">
            <input type="button" value="7" class="number"  onclick="getNumber(7)">
            <input type="button" value="8" class="number"  onclick="getNumber(8)">
            <input type="button" value="9" class="number"  onclick="getNumber(9)">
            <input type="button" value="/" class="operator" onclick="getOperator('/')">
            <input type="button" value="4" class="number"  onclick="getNumber(4)">
            <input type="button" value="5" class="number"  onclick="getNumber(5)">
            <input type="button" value="6" class="number"  onclick="getNumber(6)">
            <input type="button" value="*" class="operator" onclick="getOperator('*')">
            <input type="button" value="1" class="number"  onclick="getNumber(1)">
            <input type="button" value="2" class="number"  onclick="getNumber(2)">
            <input type="button" value="3" class="number"  onclick="getNumber(3)">
            <input type="button" value="-" class="operator" onclick="getOperator('-')">
            <input type="button" value="0" class="number"  onclick="getNumber(0)">
            <input type="button" value="." class="number" onclick="getNumber('.')">
            <input type="button" value="=" class="equal"  onclick="calculateResult()">
            <input type="button" value="+" class="operator" onclick="getOperator('+')">

        </div>

    </div>
<script src="index.js"></script>
</body>
</html>
